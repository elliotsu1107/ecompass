<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #17202a; background: #f5f7f9; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
    nav { margin-bottom: 24px; }
    nav a { color: #145da0; }
    section { background: #fff; border: 1px solid #d8dee4; border-radius: 6px; padding: 20px; margin-top: 20px; }
    .danger-zone { border-color: #e0a0a0; }
    .scope { margin: 8px 0 16px; padding-left: 20px; columns: 2; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input { box-sizing: border-box; padding: 8px 10px; border: 1px solid #aab4be; border-radius: 4px; max-width: 280px; width: 100%; }
    button { margin-top: 14px; padding: 9px 14px; border: 0; border-radius: 4px; color: #fff; background: #b42318; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .message { margin-top: 16px; white-space: pre-wrap; }
    .error { color: #b42318; }
    .success { color: #176b3a; }
    @media (max-width: 600px) { .scope { columns: 1; } }
  </style>
</head>
<body>
  <main>
    <h1>基础资料管理</h1>
    <nav><a href="/import">导入数据</a></nav>
    <section id="admin-root"></section>
    <section class="danger-zone" aria-labelledby="reset-title">
      <h2 id="reset-title">清空全部业务数据</h2>
      <p>操作前系统会自动备份数据库。管理员资料、数据库结构和备份文件不会删除。</p>
      <p><strong>删除范围：</strong></p>
      <ul class="scope">
        <li>店铺、类目、运营人员</li>
        <li>产品资料</li>
        <li>店铺、商品和推广日报</li>
        <li>店铺、类目和运营目标</li>
        <li>导入记录和字段映射</li>
      </ul>
      <form id="reset-form">
        <label for="reset-confirmation">请输入 CLEAR</label>
        <input id="reset-confirmation" name="confirmation" autocomplete="off" spellcheck="false" required>
        <button type="submit">清空全部业务数据</button>
      </form>
      <div id="reset-message" class="message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="/static/admin.js"></script>
</body>
</html>
